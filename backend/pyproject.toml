[project]
name = "meeting-transcriber-backend"
version = "0.2.0"
description = "Local transcription + diarization server for the Obsidian Meeting Transcriber plugin"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
    "onnxruntime>=1.18",
    # Whisper on NVIDIA GPUs and CPUs
    "faster-whisper>=1.1",
    # cuBLAS for faster-whisper on NVIDIA GPUs (no CUDA toolkit needed)
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Whisper on the Apple GPU (Apple Silicon, macOS 14+ = Darwin 23+)
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'",
]

[tool.uv]
package = false
# mlx-whisper lists PyTorch, but only uses it to convert models, which we never do.
override-dependencies = ["torch; sys_platform == 'never'"]
