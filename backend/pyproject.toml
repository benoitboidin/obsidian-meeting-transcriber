[project]
name = "meeting-transcriber-backend"
version = "0.1.0"
description = "Local transcription + diarization server for the Obsidian Meeting Transcriber plugin"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faster-whisper>=1.1",
    "pyannote.audio>=4.0",
    "torch>=2.8",
    # Whisper on the Apple GPU (Apple Silicon only; elsewhere faster-whisper is used)
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
